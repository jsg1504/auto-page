name: doc-request-opened

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

jobs:
  apply-needs-review:
    if: contains(join(github.event.issue.labels.*.name, ','), 'doc-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply needs-review state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUESTER_POOL: ${{ secrets.REQUESTER_POOL }}
          ENFORCE_REQUESTER_POOL: ${{ vars.ENFORCE_REQUESTER_POOL || 'false' }}
        run: python scripts/run_workflow.py issue-opened
