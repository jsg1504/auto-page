name: doc-request-retry-requested

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  reset-for-review:
    if: github.event.label.name == 'state:retry-requested' && contains(join(github.event.issue.labels.*.name, ','), 'doc-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reset issue back to needs-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/run_workflow.py retry-requested
