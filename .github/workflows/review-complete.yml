name: doc-request-review-complete

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write

jobs:
  generate-document:
    if: github.event.label.name == 'state:review-complete' && contains(join(github.event.issue.labels.*.name, ','), 'doc-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate document and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4
          REVIEWER_POOL: ${{ secrets.REVIEWER_POOL }}
        run: python scripts/run_workflow.py review-complete
